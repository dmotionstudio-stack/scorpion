# Deploys the website to Cloudflare: the pages as static assets, and /api/* through worker.js.
#   cd website && npx wrangler deploy
# (docs/cloudflare-downloads.md has the whole setup, secrets included.)
name = "scorpion-website"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"] # process.env for the settings and secrets

# The site's own domain (its zone is on this Cloudflare account); the DNS records are created automatically.
routes = [
  { pattern = "scorpionai.tech", custom_domain = true },
  { pattern = "www.scorpionai.tech", custom_domain = true },
]

[assets]
directory = "."          # the pages; .assetsignore keeps the server code and tooling out
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Where paid downloads come from. r2://<bucket name> streams them from the private bucket bound below;
# an https address (a public bucket or a custom domain) redirects the buyer there instead.
DOWNLOAD_BASE_URL = "r2://scorpion-downloads"
# SITE_URL = "https://your-site.example"   # optional: the public address, for Stripe's return links
# Who the sign-in code email comes from: an address on a domain verified at Resend.
MAIL_FROM = "Scorpion <login@scorpionai.tech>"

# The bucket the release workflows fill (the same name as above).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "scorpion-downloads"

# Sign-in codes, rate limits and each customer's list of orders (My downloads). No id is given, so Wrangler
# creates the namespace itself on the next deploy.
[[kv_namespaces]]
binding = "AUTH_KV"

# Secrets are not kept here:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   (the signing secret of the Stripe webhook)
#   npx wrangler secret put RESEND_API_KEY          (sends the sign-in code)
#   npx wrangler secret put SESSION_SECRET          (any long random text; signs the sign-in cookie)
