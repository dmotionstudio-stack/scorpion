# Deploys the website (pages and its /api backend) to Cloudflare whenever website/ changes on main.
# Needs the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/cloudflare-downloads.md); without them it
# does nothing.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 22
      - name: Test the Worker
        if: env.HAS_CLOUDFLARE == 'true'
        run: node --test test/website-worker.test.js
      - name: Not deployed (no Cloudflare secrets)
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning title=Website not deployed::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set. See docs/cloudflare-downloads.md, step 3."
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        # A failed deploy says why in the run's annotations (Wrangler's own words: it never prints a secret).
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            msg=$(tail -14 deploy.log | tr -cd '[:print:]\n' | tr '\n' '|')
            echo "::error title=Deploy failed::${msg}"
            exit 1
          fi
