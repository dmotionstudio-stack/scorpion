# Scorpion OS: builds Scorpion for Linux (.deb and AppImage) and publishes it
# to Scorpion's apt repository (GitHub Pages), then the bootable live /
# installer ISO from Ubuntu 24.04 packages with a built-in model and voice,
# then boots it in QEMU to check that Scorpion comes up. Run it from the
# Actions tab ("Run workflow"), or push a tag like os-v0.1.
name: Scorpion OS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Scorpion OS version
        default: "0.1"
      model:
        description: Built-in model (a catalog id like qwen3-4b, llama3.2-1b, or none)
        default: qwen3-4b
      publish:
        description: Publish this Scorpion build to the update repository
        type: boolean
        default: true
  push:
    tags: ["os-v*"]

env:
  SCORPION_OS_VERSION: ${{ inputs.version || '0.1' }}
  SCORPION_MODEL: ${{ inputs.model || 'qwen3-4b' }}

jobs:
  linux-app:
    name: Scorpion for Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (on Linux)
        run: npm test
        continue-on-error: true
      - name: Check the shell host's Python
        run: python3 -m py_compile os/rootfs/usr/lib/scorpion-os/scorpion-shell && bash -n os/build-iso.sh
      # The model engine runs in plain Node on Linux (src/main/engine-process.js).
      - name: Node runtime for the model engine
        run: |
          v=24.11.0
          f=node-v$v-linux-x64.tar.xz
          curl -fsSLO "https://nodejs.org/dist/v$v/$f"
          curl -fsSL "https://nodejs.org/dist/v$v/SHASUMS256.txt" | grep " $f\$" | sha256sum -c -
          mkdir -p vendor/linux-node
          tar -xJf "$f" -C vendor/linux-node --strip-components=1 "node-v$v-linux-x64/LICENSE"
          tar -xJf "$f" -C vendor/linux-node --strip-components=2 "node-v$v-linux-x64/bin/node"
          vendor/linux-node/node --version
      - name: Build .deb and AppImage
        run: npx electron-builder --linux deb AppImage --x64 --publish never
      - name: The model engine starts in the packaged app
        run: |
          app=release/linux-unpacked
          test -x "$app/resources/node/node"
          cd "$app/resources/app" && "../node/node" -e "import('./src/main/engine.js').then(async (e) => { const hw = await e.hardwareInfo(); console.log('engine ok', hw.gpu); await e.shutdown(); })"
      # Each build is a newer package than the last (VERSION-RUN), so
      # Software Updater offers it.
      - name: Stamp the build number on the .deb
        run: |
          deb=$(ls release/*.deb)
          v="$(node -p "require('./package.json').version")-${{ github.run_number }}"
          sudo dpkg-deb -R "$deb" pkg
          sudo sed -i "s/^Version: .*/Version: $v/" pkg/DEBIAN/control
          rm -f "$deb"
          sudo dpkg-deb -Zxz -b pkg "release/scorpion_${v}_amd64.deb"
          sudo rm -rf pkg
          sudo chown "$(id -u):$(id -g)" release/*.deb
          dpkg-deb -f release/*.deb Package Version
      - uses: actions/upload-artifact@v4
        with:
          name: scorpion-linux
          path: |
            release/*.deb
            release/*.AppImage
          retention-days: 14

  apt-repo:
    name: Update repository (GitHub Pages)
    needs: linux-app
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scorpion-linux
          path: app
      - name: Build the signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: bash os/apt/make-repo.sh app site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  iso:
    name: Scorpion OS ISO
    needs: linux-app
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scorpion-linux
          path: app
      # The model and voice Scorpion OS starts with (no download needed).
      - uses: actions/cache@v4
        if: env.SCORPION_MODEL != 'none'
        with:
          path: bundle
          key: bundle-${{ env.SCORPION_MODEL }}-voice-v1
      - uses: actions/setup-node@v4
        if: env.SCORPION_MODEL != 'none'
        with:
          node-version: 24
          cache: npm
      - name: Built-in model and voice
        if: env.SCORPION_MODEL != 'none'
        run: |
          if [ ! -f bundle/voice/installed.json ] || ! ls bundle/models/*.gguf >/dev/null 2>&1; then
            npm ci --ignore-scripts
            node scripts/fetch-models.mjs bundle/models "$SCORPION_MODEL"
            node --input-type=module -e "const v = await import('./src/main/voice.js'); v.initVoice('bundle'); await v.installVoice(); console.log(v.voiceStatus());"
          fi
          du -sh bundle/*
      - name: Room to build (the runner's spare disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - name: Build the ISO
        run: sudo --preserve-env=SCORPION_OS_VERSION WORK=/mnt/scorpion-os OUT="$PWD/out" BUNDLE="$([ -d bundle ] && echo "$PWD/bundle")" bash os/build-iso.sh app/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: scorpion-os-iso
          path: out/
          compression-level: 0
          retention-days: 14

  boot-test:
    name: Boot test (QEMU)
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: scorpion-os-iso
          path: out
      - name: QEMU, UEFI firmware and KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso imagemagick
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the ISO
        run: node os/test/boot-test.mjs out/*.iso shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-pictures
          path: shots/
          retention-days: 14
