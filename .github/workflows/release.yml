# Builds installers for Windows (.exe) and macOS (.dmg + .zip, Apple Silicon + Intel).
# Run it from the Actions tab, or push a tag like v0.1.0: a tag also publishes
# them as a GitHub release, with docs/releases/<tag>.md as its notes.
# Set the input "bundle_model" to ship a model inside the installer (fully offline install).
# The release also carries latest.yml and the installer's .blockmap: installed
# Windows copies read them to update themselves (src/main/app-updates.js). So does the Mac, once its builds
# are signed and notarized with an Apple Developer ID (docs/signing-mac.md): the zips and latest-mac.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: 'Catalog model ids to bundle (space separated, empty for none), e.g. "qwen3.5-4b"'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            arch: x64
          # npm installs only the llama.cpp binary for the runner's CPU, so each
          # Mac architecture is built on its own runner.
          - os: macos-latest
            target: --mac --arm64
            arch: arm64
          - os: macos-15-intel
            target: --mac --x64
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # True when a Windows signing account is set up (docs/signing-windows.md): Azure Trusted Signing, or a certificate file.
      # True when an Apple Developer ID is set up (docs/signing-mac.md): the Mac builds are signed and notarized, and update themselves.
      MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      WINDOWS_SIGNING: ${{ (secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '') || secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bundle models
        if: ${{ github.event.inputs.bundle_model != '' }}
        run: node scripts/fetch-models.mjs resources/models ${{ github.event.inputs.bundle_model }}
      - name: Build installer
        # macOS is signed with a Developer ID and notarized when docs/signing-mac.md has been followed (MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD,
        # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID); with none of them it is signed ad hoc, as before (and then updates by download).
        # Windows is signed when docs/signing-windows.md has been followed: Azure Trusted Signing (AZURE_* secrets and AZURE_SIGNING_* variables)
        # or a certificate file (WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD). With neither, the installer is unsigned, as before.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.SIGNING_PUBLISHER_NAME }}
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$SIGN_ENDPOINT" ]; then
            extra="-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT -c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT -c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE -c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER"
            echo "Signing the Windows installer with Azure Trusted Signing"
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing the Windows installer with the certificate file"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "::warning::The Windows installer is NOT signed (no signing account is set up: see docs/signing-windows.md)."
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ "$MAC_SIGNING" = "true" ]; then
            # The Mac's certificate goes only to the Mac jobs (never to the Windows one).
            # Our own keychain, with a password we know: electron-builder's temporary one could not be unlocked on the newest runner image
            # ("SecKeychainUnlock: The user name or passphrase you entered is not correct").
            KC="$RUNNER_TEMP/scorpion-signing.keychain-db"
            KCP="$(uuidgen)"
            security create-keychain -p "$KCP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCP" "$KC"
            printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/mac-cert.p12"
            security import "$RUNNER_TEMP/mac-cert.p12" -k "$KC" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/mac-cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" || { echo "No valid Developer ID Application identity in the certificate"; security find-identity -p codesigning "$KC"; exit 1; }
            export CSC_KEYCHAIN="$KC" CSC_IDENTITY_AUTO_DISCOVERY=true
            unset CSC_LINK CSC_KEY_PASSWORD
            extra="-c.mac.notarize=true"
            echo "Signing the Mac app with the Developer ID and notarizing it"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            extra="-c.mac.identity=-"
            echo "::warning::The Mac app is NOT signed with a Developer ID (docs/signing-mac.md): it is signed ad hoc and updates by download."
          fi
          npx electron-builder ${{ matrix.target }} --publish never $extra
      # A signed release must really be signed: a certificate or account that was set up wrongly stops the release instead of shipping an
      # installer that Windows warns about (and that the updater would refuse).
      - name: Check the Windows signature
        if: ${{ runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true' }}
        shell: pwsh
        run: |
          $bad = @()
          foreach ($f in Get-ChildItem release/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad += $f.Name }
          }
          if ($bad.Count) { throw "Not validly signed: $($bad -join ', ')" }
      # A Developer-ID release must really be signed and notarized: a certificate set up wrongly stops the release instead of shipping a
      # Mac app that Gatekeeper warns about (and that the updater would refuse to install).
      - name: Check the Mac signature
        if: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' }}
        run: |
          app=$(ls -d release/mac*/Scorpion.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q "Authority=Developer ID Application" || { echo "Not signed with a Developer ID Application certificate"; exit 1; }
          xcrun stapler validate "$app"
          spctl -a -t exec -vv "$app"
      # Each Mac architecture writes its own latest-mac.yml: keep them apart, the release job merges them.
      - name: Name the Mac update file by architecture
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -f release/latest-mac.yml ]; then mv release/latest-mac.yml "release/latest-mac-${{ matrix.arch }}.yml"; else echo "::warning::No latest-mac.yml was built"; fi
      # The app as people get it: it starts, its model engine runs in a process
      # of its own, the Windows helper builds, older settings are brought up to
      # date (scripts/smoke-test.mjs). A failure here stops the release.
      - name: Check the packaged app
        run: node scripts/smoke-test.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: scorpion-${{ matrix.os }}
          # Windows also: latest.yml and the blockmap, for its updater. The Mac: the zips and update file, for the same.
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac-*.yml
          if-no-files-found: error

  # A tag (v0.1.8): the three installers become a GitHub release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to start the Website workflow once the site's version is bumped
    env:
      # True once the Cloudflare R2 secrets are set (docs/cloudflare-downloads.md).
      HAS_R2: ${{ secrets.R2_BUCKET != '' && secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub turns spaces in file names into dots, but latest.yml names
          # the installer with dashes (Scorpion-Setup-x.y.z.exe): rename to
          # match, and make sure the file it names is there.
          for f in dist/*' '*; do if [ -e "$f" ]; then mv "$f" "${f// /-}"; fi; done
          ls -la dist
          # One latest-mac.yml for both Mac architectures (installed, Developer-ID-signed Mac copies read it).
          if ls dist/latest-mac-*.yml >/dev/null 2>&1; then
            node scripts/merge-mac-yml.mjs dist/latest-mac-arm64.yml dist/latest-mac-x64.yml dist/latest-mac.yml
            rm dist/latest-mac-arm64.yml dist/latest-mac-x64.yml
            grep -q "^version: ${GITHUB_REF_NAME#v}$" dist/latest-mac.yml || { echo "latest-mac.yml isn't version ${GITHUB_REF_NAME#v}"; exit 1; }
          fi
          want="dist/$(sed -n 's/^path: //p' dist/latest.yml)"
          [ -f "$want" ] || { echo "latest.yml names $want, which isn't here"; exit 1; }
          grep -q "^version: ${GITHUB_REF_NAME#v}$" dist/latest.yml || { echo "latest.yml isn't version ${GITHUB_REF_NAME#v}"; exit 1; }
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/*.dmg dist/*.zip dist/*.zip.blockmap dist/latest-mac.yml --title "Scorpion ${GITHUB_REF_NAME#v}" "$@"
      # The website's downloads come from Cloudflare R2 (a GitHub release holds files up to 2 GB; this is also where
      # the big Scorpion OS image goes). Files go to <bucket>/<version>/ under the names the website's catalog uses.
      - name: Copy the installers to Cloudflare R2
        if: env.HAS_R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          v="${GITHUB_REF_NAME#v}"
          put() { aws s3 cp "$1" "s3://$R2_BUCKET/$v/$2" --endpoint-url "$R2_ENDPOINT" --no-progress; }
          for f in dist/*.exe; do put "$f" "Scorpion Setup $v.exe"; done
          for f in dist/*arm64.dmg; do put "$f" "Scorpion-$v-arm64.dmg"; done
          for f in dist/*.dmg; do case "$f" in *arm64.dmg) ;; *) put "$f" "Scorpion-$v.dmg";; esac; done
      # Only after the files are there: the website sells (and Lifetime downloads) this version.
      - name: Point the website at this version
        if: env.HAS_R2 == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          sed -i "s/^export const CURRENT_VERSION = '.*';/export const CURRENT_VERSION = '$v';/" website/data/catalog.js
          if ! git diff --quiet; then
            git config user.name 'Scorpion'
            git config user.email '274588930+dmotionstudio-stack@users.noreply.github.com'
            git commit -am "Website: version $v is on sale"
            git push origin main
          fi
      # A push made with the workflow's own token does not start other workflows, so start the site's deploy here.
      - name: Deploy the website
        if: env.HAS_R2 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main
      # Says which of the four is missing (only names, never values): a secret with a slightly different name, or kept as an environment
      # secret or a variable instead of a repository secret, looks the same as not set.
      - name: Which Cloudflare R2 secrets are missing
        if: env.HAS_R2 != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for n in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!n}" ]; then echo "::error title=Missing secret::$n is empty or not set: it has to be a repository secret with exactly this name (Settings, Secrets and variables, Actions)"; else echo "$n is set"; fi
          done
      - name: The website was not updated (no Cloudflare R2 secrets)
        if: env.HAS_R2 != 'true'
        run: echo "::warning title=Website not updated::The R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET secrets are not set, so the installers were not copied to the website's bucket and the site was not redeployed. See docs/cloudflare-downloads.md. (The free downloads on the Download page still follow this GitHub release.)"
