# Builds installers for Windows (.exe) and macOS (.dmg, Apple Silicon + Intel).
# Run it from the Actions tab, or push a tag like v0.1.0: a tag also publishes
# them as a GitHub release, with docs/releases/<tag>.md as its notes.
# Set the input "bundle_model" to ship a model inside the installer (fully offline install).
# The release also carries latest.yml and the installer's .blockmap: installed
# Windows copies read them to update themselves (src/main/app-updates.js).
name: Release

on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: 'Catalog model ids to bundle (space separated, empty for none), e.g. "qwen3-4b nomic-embed"'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          # npm installs only the llama.cpp binary for the runner's CPU, so each
          # Mac architecture is built on its own runner.
          - os: macos-latest
            target: --mac --arm64
          - os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bundle models
        if: ${{ github.event.inputs.bundle_model != '' }}
        run: node scripts/fetch-models.mjs resources/models ${{ github.event.inputs.bundle_model }}
      - name: Build installer
        # macOS output is unsigned unless you add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID secrets.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.target }} --publish never
      # The app as people get it: it starts, its model engine runs in a process
      # of its own, the Windows helper builds, older settings are brought up to
      # date (scripts/smoke-test.mjs). A failure here stops the release.
      - name: Check the packaged app
        run: node scripts/smoke-test.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: scorpion-${{ matrix.os }}
          # Windows also: latest.yml and the blockmap, for its updater.
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
          if-no-files-found: error

  # A tag (v0.1.8): the three installers become a GitHub release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub turns spaces in file names into dots, but latest.yml names
          # the installer with dashes (Scorpion-Setup-x.y.z.exe): rename to
          # match, and make sure the file it names is there.
          for f in dist/*' '*; do if [ -e "$f" ]; then mv "$f" "${f// /-}"; fi; done
          ls -la dist
          want="dist/$(sed -n 's/^path: //p' dist/latest.yml)"
          [ -f "$want" ] || { echo "latest.yml names $want, which isn't here"; exit 1; }
          grep -q "^version: ${GITHUB_REF_NAME#v}$" dist/latest.yml || { echo "latest.yml isn't version ${GITHUB_REF_NAME#v}"; exit 1; }
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/*.dmg --title "Scorpion ${GITHUB_REF_NAME#v}" "$@"
