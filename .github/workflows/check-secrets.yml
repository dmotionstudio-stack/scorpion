# Says which of the repository secrets the workflows rely on are set (only their names, never their values): a quick way to find a secret that
# is missing, misspelled, or kept as an environment secret or a variable instead of a repository secret. Run it from the Actions tab ("Run
# workflow"), or push a tag like check-secrets-1. The answer is in the annotations on the run's summary page.
name: Check secrets

on:
  workflow_dispatch:
  push:
    tags: ["check-secrets*"]

jobs:
  check:
    name: Which secrets are set
    runs-on: ubuntu-24.04
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
    steps:
      - name: Report
        shell: bash
        run: |
          for n in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!n}" ]; then echo "::error title=Missing secret::$n is empty or not set"; else echo "::notice title=Secret is set::$n is set"; fi
          done
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APT_SIGNING_KEY WIN_CSC_LINK MAC_CSC_LINK; do
            if [ -z "${!n}" ]; then echo "::warning title=Not set::$n is not set (only needed for what it enables)"; else echo "::notice title=Secret is set::$n is set"; fi
          done
          # The R2 bucket's name is not secret: it helps to see a stray space or capital.
          if [ -n "$R2_BUCKET" ]; then echo "::notice title=Bucket name::R2_BUCKET is $(printf '%s' "$R2_BUCKET" | sed 's/ /<space>/g') (length ${#R2_BUCKET})"; fi
          if [ -n "$R2_ACCOUNT_ID" ]; then echo "::notice title=Account id length::R2_ACCOUNT_ID has ${#R2_ACCOUNT_ID} characters (a Cloudflare account id has 32)"; fi
          if [ -n "$R2_ACCESS_KEY_ID" ]; then echo "::notice title=Access key id length::R2_ACCESS_KEY_ID has ${#R2_ACCESS_KEY_ID} characters (R2 access key ids have 32)"; fi
          if [ -n "$R2_SECRET_ACCESS_KEY" ]; then echo "::notice title=Secret key length::R2_SECRET_ACCESS_KEY has ${#R2_SECRET_ACCESS_KEY} characters (R2 secret keys have 64)"; fi
