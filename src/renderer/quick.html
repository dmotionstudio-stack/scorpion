<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Scorpion quick settings</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="quick.css">
  <script src="shell-bridge.js"></script>
  <script type="module" src="quick.js"></script>
</head>
<body class="quick">
  <section class="qs" id="qs" aria-label="Quick settings" hidden>
    <header class="qs-head">
      <span>Quick settings</span>
      <span class="qs-head-acts">
        <button class="qs-icon-btn" id="qs-all" title="All settings" aria-label="All settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="qs-icon-btn" id="qs-close" title="Close (Esc)" aria-label="Close">×</button>
      </span>
    </header>

    <div class="qs-tiles">
      <div class="qs-tile" id="qs-wifi">
        <button class="qs-tile-main" data-toggle="wifi" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.8 12.4a9.3 9.3 0 0 1 12.4 0"/><path d="M9.1 15.8a4.6 4.6 0 0 1 5.8 0"/><circle cx="12" cy="19" r="1.1" class="qs-fill"/></svg>
          <span class="qs-tile-text"><b>Wi-Fi</b><small id="qs-wifi-sub"></small></span>
        </button>
        <button class="qs-more" data-expand="wifi" title="Networks" aria-label="Show Wi-Fi networks" aria-expanded="false">›</button>
      </div>
      <div class="qs-tile" id="qs-bt">
        <button class="qs-tile-main" data-toggle="bluetooth" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg>
          <span class="qs-tile-text"><b>Bluetooth</b><small id="qs-bt-sub"></small></span>
        </button>
        <button class="qs-more" data-expand="bt" title="Devices" aria-label="Show Bluetooth devices" aria-expanded="false">›</button>
      </div>
    </div>

    <div class="qs-list" id="qs-wifi-list" hidden></div>
    <div class="qs-list" id="qs-bt-list" hidden></div>

    <div class="qs-row" id="qs-sound">
      <button class="qs-icon-btn" id="qs-mute" title="Mute" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="qs-wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="qs-wave" d="M19 6a9 9 0 0 1 0 12"/><path class="qs-cross" d="m16 9 6 6m0-6-6 6"/></svg></button>
      <input type="range" min="0" max="100" id="qs-volume" aria-label="Volume">
      <span class="qs-pct" id="qs-volume-pct"></span>
    </div>
    <label class="qs-output" id="qs-output-row" hidden>Output <select id="qs-output" aria-label="Sound output"></select></label>

    <div class="qs-row" id="qs-bright" hidden>
      <span class="qs-icon-btn qs-static"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <input type="range" min="5" max="100" id="qs-brightness" aria-label="Brightness">
      <span class="qs-pct" id="qs-bright-pct"></span>
    </div>

    <div class="qs-battery" id="qs-battery" hidden>
      <div class="qs-battery-line"><b id="qs-battery-pct"></b><span id="qs-battery-time"></span></div>
      <div class="qs-modes" id="qs-modes" role="radiogroup" aria-label="Power mode" hidden>
        <button data-profile="power-saver" role="radio">Saver</button>
        <button data-profile="balanced" role="radio">Balanced</button>
        <button data-profile="performance" role="radio">Performance</button>
      </div>
    </div>

    <div class="qs-msg" id="qs-msg" role="status" hidden></div>
  </section>
</body>
</html>
