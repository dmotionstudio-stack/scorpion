<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' scorpion:; img-src 'self' scorpion: data:; style-src 'self' scorpion: 'unsafe-inline'">
  <title>Scorpion desktop</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Scorpion OS's desktop background, behind every window (the shell host
       shows it on the background layer): the picture chosen in Scorpion, or
       the theme's own colours. Right-click for the Desktop background menu. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background:
        var(--wall, none) center / cover no-repeat,
        radial-gradient(60vw 60vh at 15% 20%, color-mix(in srgb, var(--glow-1, #f5c518) 32%, transparent), transparent 70%),
        radial-gradient(60vw 60vh at 85% 80%, color-mix(in srgb, var(--glow-2, #e07a00) 26%, transparent), transparent 70%),
        var(--bg, #0e0d0b);
      transition: background .6s;
    }
    /* The Desktop folder's items, down the left and then across (wallpaper.js). */
    .dt-icons { position: fixed; inset: 12px 96px 12px 12px; display: flex; flex-flow: column wrap; align-content: flex-start; gap: 6px; font: 13px/1.25 system-ui, sans-serif; color: var(--ink, #f4efe6); }
    .dt-item { width: 92px; padding: 8px 4px 6px; border: 1px solid transparent; border-radius: 8px; background: none; color: inherit; font: inherit; cursor: default; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .dt-item svg { width: 44px; height: 44px; color: var(--accent, #f5c518); filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    .dt-item:hover { background: rgba(255,255,255,.08); }
    .dt-item.selected { background: color-mix(in srgb, var(--accent, #f5c518) 22%, transparent); border-color: color-mix(in srgb, var(--accent, #f5c518) 55%, transparent); }
    .dt-name { max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
    .dt-rename input { width: 86px; box-sizing: border-box; font: inherit; text-align: center; color: #111; background: #fff; border: 1px solid var(--accent, #f5c518); border-radius: 4px; padding: 2px; }
  </style>
  <script src="shell-bridge.js"></script>
  <script type="module" src="wallpaper.js"></script>
</head>
<body></body>
</html>
