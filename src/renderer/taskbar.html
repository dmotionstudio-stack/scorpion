<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' scorpion:; img-src 'self' scorpion: data:; style-src 'self' scorpion: 'unsafe-inline'">
  <title>Scorpion taskbar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="taskbar.css">
  <script type="module" src="taskbar.js"></script>
</head>
<body class="taskbar">
  <div class="rail-grip" id="rail-grip" title="Drag to resize the taskbar" aria-hidden="true"></div>
  <div class="tb-scan" aria-hidden="true"></div><div class="tb-sweep" aria-hidden="true"></div>
  <div class="tb-start">
    <button class="tb-btn tb-summon" id="tb-summon" title="Summon: the intent wheel (Win+Shift+Space)"><svg class="tb-sum" viewBox="0 0 24 24" aria-hidden="true"><circle class="sum-ring" cx="12" cy="12" r="10.2"/><circle class="sum-ring" cx="12" cy="12" r="6.4" opacity=".6"/><circle class="sum-core" cx="12" cy="12" r="2.8"/></svg></button>
    <button class="tb-btn tb-home" id="tb-home" title="Scorpion: the orb (or Home)">
      <svg class="tb-logo" viewBox="0 0 100 100" aria-hidden="true">
        <g transform="rotate(-45 50 53) translate(50 53) scale(1.18) translate(-50 -53)">
          <polygon points="43.7,47 38.5,36.6 50,10 61.5,36.6 56.3,47" fill="var(--accent)"/>
          <polygon points="43.7,47 38.5,36.6 50,10 50,47" fill="#000" opacity=".22"/>
          <rect x="46.4" y="46" width="7.2" height="34" fill="var(--accent-2)"/>
          <g fill="var(--logo-wrap)"><rect x="46.4" y="52" width="7.2" height="3"/><rect x="46.4" y="59" width="7.2" height="3"/><rect x="46.4" y="66" width="7.2" height="3"/><rect x="46.4" y="73" width="7.2" height="3"/></g>
          <circle cx="50" cy="86.5" r="5.9" fill="none" stroke="var(--accent)" stroke-width="3.4"/>
        </g>
      </svg>
    </button>
    <button class="tb-btn" id="tb-apps" title="Apps"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <button class="tb-btn" id="tb-files" title="Files"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  </div>
  <div class="tb-apps-area" id="tb-apps-area"><nav class="tb-pinned" id="tb-pinned" aria-label="Pinned apps"></nav><nav class="tb-pinned tb-links" id="tb-links" aria-label="Folders and files"></nav><span class="tb-sep" id="tb-sep" hidden></span><nav class="tb-windows" id="tb-windows" aria-label="Open windows"></nav></div>
  <div class="tb-tray">
    <button class="tb-btn tb-item" id="tb-tray" hidden title="Network, notifications, mail, chat and sound" aria-haspopup="menu"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="m14.5 16.5 2.5 2.5 2.5-2.5"/></svg></button>
    <button class="tb-btn tb-item" id="tb-drives" hidden title="USB and external drives" aria-haspopup="menu"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13"/><circle cx="12" cy="19" r="2"/><path d="M12 10 8 13v-2.5"/><rect x="6.5" y="8" width="3" height="2.5"/><path d="M12 8l4 2.5v1.5"/><circle cx="16" cy="13.3" r="1.1"/></svg></button>
    <span class="tb-item" id="tb-net" title="Network"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/></svg></span>
    <span class="tb-item" id="tb-battery" hidden><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><rect id="tb-battery-fill" x="4" y="9" width="14" height="6" rx="1" class="tb-fill"/></svg><span id="tb-battery-pct"></span></span>
    <button class="tb-btn tb-item" data-glance="notifications" title="Notifications"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
    <button class="tb-btn tb-item" data-glance="mail" title="Mail"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg></button>
    <button class="tb-btn tb-item" data-glance="chat" title="Chat with Scorpion"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-2-.1-2.9-.4L5 19.5l1.2-3.6C4.5 14.6 3.5 12.9 3.5 11 3.5 7.1 7.3 4 12 4z"/></svg></button>
    <button class="tb-btn tb-item" id="tb-volume" title="Volume: click to mute, scroll to change"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg></button>
    <button class="tb-btn tb-clock" id="tb-clock" title="Calendar"><span id="tb-time"></span><span id="tb-date"></span></button>
    <button class="tb-btn" id="tb-power" title="Power"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
  </div>
</body>
</html>
