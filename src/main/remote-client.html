<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Scorpion Remote</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --card: #151922; --line: #262c3a; --text: #e8ecf4; --dim: #8a93a6; --accent: #f0a63c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
  .card { max-width: 380px; margin: 12vh auto 0; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .card h1 { margin: 0 0 6px; font-size: 20px; }
  .card p { color: var(--dim); margin: 0 0 16px; }
  input, button { font: inherit; color: var(--text); background: #0f131b; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .card input { width: 100%; margin-bottom: 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; width: 100%; }
  button.on { background: var(--accent); color: #1a1205; border-color: var(--accent); }
  #msg { color: #ff9b8f; min-height: 1.4em; margin-top: 10px; }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0 0 46px 0; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #view { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 46px; display: flex; gap: 6px; align-items: center; padding: 5px 8px; background: var(--card); border-top: 1px solid var(--line); overflow-x: auto; }
  #bar button { padding: 6px 10px; white-space: nowrap; }
  #kb { position: fixed; left: -100px; top: 0; width: 10px; opacity: 0; }
</style>
</head>
<body>
<div class="card" id="pairBox" hidden>
  <h1>Scorpion Remote</h1>
  <p>On the computer, open Scorpion → Settings → Connections → Remote control and press “Pair a device”. Type the 6-digit code it shows.</p>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="off">
  <input id="devname" maxlength="40" placeholder="Name this device (for example My phone)" autocomplete="off">
  <button class="primary" id="pairBtn">Pair</button>
  <div id="msg"></div>
</div>
<div class="card" id="waitBox" hidden>
  <h1>Waiting for the computer…</h1>
  <p id="waitText">Someone at the computer must press Allow.</p>
  <button id="cancelBtn">Reload</button>
</div>
<div id="stage" hidden><img id="view" alt="The computer's screen" draggable="false"></div>
<div id="bar" hidden>
  <button id="bKb">Keyboard</button>
  <button id="bEsc">Esc</button><button id="bTab">Tab</button><button id="bCtrl">Ctrl</button><button id="bAlt">Alt</button><button id="bWin">Win/⌘</button>
  <button id="bEnter">Enter</button><button id="bBack">⌫</button><button id="bDel">Del</button>
  <button id="bL">◀</button><button id="bU">▲</button><button id="bD">▼</button><button id="bR">▶</button>
  <button id="bUp">Scroll ▲</button><button id="bDown">Scroll ▼</button>
  <button id="bEnd">Disconnect</button>
</div>
<input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<script src="/client.js"></script>
</body>
</html>
