# Scorpion OS: once NVIDIA's own driver is installed (Additional drivers),
# what it needs to wake from standby with a picture: the graphics memory kept
# across sleep (with nvidia-suspend/resume, which its packages turn on), and
# kernel mode setting, which Wayland compositors (labwc) need. Without the
# driver, nothing reads this file.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia-drm modeset=1
