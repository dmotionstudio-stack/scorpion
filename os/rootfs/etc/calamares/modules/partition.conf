# Disks: erase, install alongside Windows (shrinking it), replace a
# partition, or manual. UEFI computers get an EFI system partition.
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
enableLuksAutomatedPartitioning: true
# What "Erase disk" creates besides the EFI partition: one system partition
# filling the rest (Calamares 3.3 plans none without this).
partitionLayout:
  - name: "rootfs"
    filesystem: "ext4"
    noEncrypt: false
    mountPoint: "/"
    size: 100%
