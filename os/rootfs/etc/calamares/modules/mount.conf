extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# Btrfs: the system (@) and your files (@home) apart, so undoing a system
# change (scorpion-snapshot) never touches your files; caches and logs apart
# too, so snapshots stay small. Swap goes in its own subvolume.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log
btrfsSwapSubvol: /@swap
mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
