# The boot menu lists Windows too (os-prober), and is called Scorpion OS.
overwrite: false
keep_distributor: false
prefer_grub_d: true
defaults:
  GRUB_TIMEOUT: 10
  GRUB_TIMEOUT_STYLE: menu
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_OS_PROBER: false
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: console
  GRUB_DISTRIBUTOR: "Scorpion OS"
always_use_defaults: false
