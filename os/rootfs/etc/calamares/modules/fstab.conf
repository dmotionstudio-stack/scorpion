crypttabOptions: luks
# /tmp: on disk normally; in memory (tmpfs) when the system disk is an SSD,
# which spares it the writes. Each entry must be a table: Calamares reads
# tmpfs and options from it (plain strings made the fstab job crash, on SSDs
# only).
tmpOptions:
  default:
    tmpfs: false
    options: ""
  ssd:
    tmpfs: true
    options: "defaults,noatime,mode=1777"
