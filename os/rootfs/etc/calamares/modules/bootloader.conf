# GRUB through Ubuntu's signed shim, so Secure Boot can stay on.
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelName: "vmlinuz"
kernelParams: [ "quiet", "splash" ]
kernelPattern: "^vmlinuz.*"
loaderEntries: []
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# "ubuntu": Ubuntu's signed GRUB only reads its settings from EFI/ubuntu (with any
# other name it stops at a grub> prompt), and its updates install there too.
efiBootloaderId: "ubuntu"
installEFIFallback: true
