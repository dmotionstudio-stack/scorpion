# The person installing: an administrator (sudo), with access to sound,
# video, the camera and USB devices.
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - adm
  - cdrom
  - dip
  - lpadmin
  - plugdev
  - video
  - render
  - input
  - audio
  - name: sudo
    must_exist: true
    system: true
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, scorpion-live ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "scorpion-${cpu}"
