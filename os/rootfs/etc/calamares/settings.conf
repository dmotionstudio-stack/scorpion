# Scorpion OS installer (Calamares): what it asks, then what it does.
# Installs from the live system's squashfs, alone or alongside Windows
# (the partition page offers "Install alongside" when it finds Windows).
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess
      - umount
  - show:
      - finished

branding: scorpion
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
